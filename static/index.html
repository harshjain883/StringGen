<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS (Fixed Link) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <title>String Gen Mini App</title>
    <style>
        body { 
            background-color: var(--tg-theme-bg-color, #0f172a); 
            color: var(--tg-theme-text-color, #f8fafc); 
        }
        .btn-primary { 
            background-color: var(--tg-theme-button-color, #3b82f6); 
            color: var(--tg-theme-button-text-color, #ffffff); 
        }
        input, select, textarea {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="p-6 font-sans antialiased">
    <div id="app" class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-center tracking-wide">Session Generator</h1>

        <!-- Step 1: Init -->
        <div id="step1" class="space-y-4">
            <select id="lib_type" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
                <option value="pyrogram">Pyrogram v2</option>
                <option value="telethon">Telethon</option>
            </select>
            <input id="api_id" type="number" placeholder="API ID (e.g. 1234567)" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
            <input id="api_hash" type="text" placeholder="API HASH" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
            <input id="phone" type="text" placeholder="Phone Number (+1234567890)" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
            <button id="btn-send-otp" onclick="sendOtp()" class="w-full p-3 btn-primary rounded font-bold transition duration-200 hover:opacity-90">Send OTP</button>
        </div>

        <!-- Step 2: OTP -->
        <div id="step2" class="hidden space-y-4">
            <p class="text-sm text-slate-400">Enter the login code sent to your Telegram account</p>
            <input id="otp" type="text" placeholder="OTP (e.g. 1 2 3 4 5)" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
            <button id="btn-verify-otp" onclick="verifyOtp()" class="w-full p-3 btn-primary rounded font-bold transition duration-200 hover:opacity-90">Verify OTP</button>
        </div>

        <!-- Step 3: 2FA -->
        <div id="step3" class="hidden space-y-4">
            <p class="text-sm text-amber-400 font-medium">Two-Step Verification (2FA) is enabled on this account</p>
            <input id="password" type="password" placeholder="Cloud Password" class="w-full p-3 rounded bg-slate-800 border border-slate-700 outline-none">
            <button id="btn-verify-2fa" onclick="verify2fa()" class="w-full p-3 btn-primary rounded font-bold transition duration-200 hover:opacity-90">Submit Password</button>
        </div>

        <!-- Step 4: Result -->
        <div id="step4" class="hidden space-y-4">
            <p class="text-sm text-green-400 font-medium">Session Generated Successfully! Keep it safe.</p>
            <textarea id="result" readonly class="w-full h-48 p-3 rounded bg-slate-900 border border-slate-700 text-xs font-mono"></textarea>
            <button onclick="copySession()" class="w-full p-3 bg-emerald-600 hover:bg-emerald-500 rounded font-bold text-white transition duration-200">Copy Session</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        let phoneHash = "";

        function notify(msg) {
            if (tg && tg.showPopup) {
                tg.showPopup({ message: msg });
            } else {
                alert(msg);
            }
        }

        async function sendOtp() {
            const apiId = document.getElementById('api_id').value.trim();
            const apiHash = document.getElementById('api_hash').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!apiId || !apiHash || !phone) {
                notify("Please fill all fields!");
                return;
            }

            const btn = document.getElementById('btn-send-otp');
            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        lib_type: document.getElementById('lib_type').value,
                        api_id: parseInt(apiId),
                        api_hash: apiHash,
                        phone_number: phone
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    phoneHash = data.phone_code_hash;
                    showStep(2);
                } else {
                    notify(data.detail || "Failed to send code.");
                }
            } catch (err) {
                notify("Network error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Send OTP";
            }
        }

        async function verifyOtp() {
            const otpVal = document.getElementById('otp').value.trim().replace(/\s/g, '');
            if (!otpVal) {
                notify("Please enter the OTP.");
                return;
            }

            const btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone_number: document.getElementById('phone').value.trim(),
                        otp: otpVal,
                        phone_code_hash: phoneHash
                    })
                });
                const data = await res.json();
                if (data.status === "2fa_required") {
                    showStep(3);
                } else if (data.status === "success") {
                    finish(data.session);
                } else {
                    notify(data.detail || "Verification failed.");
                }
            } catch (err) {
                notify("Network error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Verify OTP";
            }
        }

        async function verify2fa() {
            const pwd = document.getElementById('password').value;
            if (!pwd) {
                notify("Please enter your cloud password.");
                return;
            }

            const btn = document.getElementById('btn-verify-2fa');
            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const res = await fetch('/api/verify-2fa', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        phone_number: document.getElementById('phone').value.trim(),
                        password: pwd
                    })
                });
                const data = await res.json();
                if (data.status === "success") {
                    finish(data.session);
                } else {
                    notify(data.detail || "Invalid password.");
                }
            } catch (err) {
                notify("Network error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Password";
            }
        }

        function showStep(s) {
            [1, 2, 3, 4].forEach(i => document.getElementById(`step${i}`).classList.add('hidden'));
            document.getElementById(`step${s}`).classList.remove('hidden');
        }

        function finish(session) {
            document.getElementById('result').value = session;
            showStep(4);
        }

        function copySession() {
            const copyText = document.getElementById("result");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value).then(() => {
                notify("Session copied to clipboard!");
            }).catch(() => {
                document.execCommand("copy");
                notify("Session copied to clipboard!");
            });
        }
    </script>
</body>
</html>
